<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>T07 · 环形十二宫 v2 精修版(泛光星曜 · 清漆青铜)</title>
<style>
  :root {
    --bg: #100d0a; --gold: #d8b45a; --gold-dim: #9c7f3e; --cinnabar: #d14a35;
    --ink: #ece1c9; --muted: #a89a7c; --line: #3a3122;
    --serif: "Noto Serif SC", "Source Han Serif SC", "Songti SC", SimSun, serif;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--ink); font-family: var(--serif); overflow: hidden; }
  #stage { position: fixed; inset: 0; }
  #vignette { position: fixed; inset: 0; pointer-events: none; z-index: 2;
    background:
      radial-gradient(ellipse 120% 90% at 50% 42%, transparent 55%, rgba(6, 5, 4, 0.55) 100%),
      radial-gradient(ellipse 60% 40% at 50% 30%, rgba(216, 180, 90, 0.05), transparent 70%); }
  .hud { position: fixed; top: 26px; left: 30px; z-index: 5; }
  .hud h1 { font-size: 14px; letter-spacing: 0.45em; font-weight: 600; color: var(--muted); }
  .hud p { font-size: 11px; color: var(--muted); opacity: 0.65; margin-top: 8px; letter-spacing: 0.2em; }
  #hint { position: fixed; bottom: 20px; left: 30px; font-size: 11px; color: var(--muted);
    opacity: 0.6; letter-spacing: 0.22em; z-index: 5; }
  #panel { position: fixed; top: 0; right: 0; height: 100%; width: 320px; padding: 34px 28px;
    background: linear-gradient(to left, rgba(13, 11, 9, 0.92), rgba(13, 11, 9, 0.72));
    backdrop-filter: blur(8px); border-left: 1px solid var(--line);
    transform: translateX(102%); transition: transform 0.45s cubic-bezier(0.16, 1, 0.3, 1); z-index: 6; }
  #panel.open { transform: none; }
  #panel .tag { font-size: 10px; letter-spacing: 0.5em; color: var(--muted); opacity: 0.7; }
  #panel h2 { font-size: 30px; margin: 12px 0 2px; color: var(--gold); font-weight: 600; letter-spacing: 0.08em; }
  #panel .branch { font-size: 12px; color: var(--muted); margin-bottom: 22px; letter-spacing: 0.2em; }
  #panel .stars { list-style: none; margin: 0 0 22px; padding: 0; }
  #panel .stars li { font-size: 16px; padding: 9px 2px; border-bottom: 1px solid #292219; display: flex; justify-content: space-between; align-items: baseline; }
  #panel .stars .grade { font-size: 11px; color: var(--muted); opacity: 0.6; letter-spacing: 0.15em; }
  #panel .stars .sihua { color: var(--cinnabar); font-size: 13px; letter-spacing: 0.1em; }
  #panel .note { font-size: 13.5px; line-height: 2.1; color: #cbbfa6; }
  #panel .src { margin-top: 20px; font-size: 10.5px; color: var(--muted); opacity: 0.7; letter-spacing: 0.12em; line-height: 1.8; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="vignette"></div>
<div class="hud">
  <h1>璇玑 · 环形十二宫 V2</h1>
  <p>泛光星曜 · 清漆青铜 · 环境反射</p>
</div>
<div id="hint">拖动旋转 · 滚轮缩放 · 点击宫位看解读</div>
<aside id="panel">
  <div class="tag">PALACE</div>
  <h2 id="p-name">—</h2>
  <div class="branch" id="p-branch">—</div>
  <ul class="stars" id="p-stars"></ul>
  <p class="note" id="p-note"></p>
  <p class="src" id="p-src"></p>
</aside>

<script type="importmap">
{ "imports": { "three": "../../lib/three.module.min.js", "three/addons/": "../../lib/addons/" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';

const PALACES = [
  { name:'命宫', branch:'午', stars:[['紫微','major','科'],['左辅','minor']], note:'紫微坐命,帝座临身:格局开阔,主见与担当并存,庙旺则众星拱卫、进退有度。' },
  { name:'兄弟', branch:'未', stars:[['天机','major'],['天马','minor']], note:'天机入兄弟,手足各异志:彼此机敏善谋,聚少离多而情理常在。' },
  { name:'夫妻', branch:'申', stars:[['太阳','major','权']], note:'太阳入夫妻化权,配偶明朗主事:光照他宫,家中有主心骨。' },
  { name:'子女', branch:'酉', stars:[['武曲','major','忌'],['七杀','major']], note:'武曲化忌会七杀,子女刚毅果决:管教宜疏不宜堵。' },
  { name:'财帛', branch:'戌', stars:[['天府','major']], note:'天府入财帛,库星守财:进财稳厚、善守善积,取财有道而格局大。' },
  { name:'疾厄', branch:'亥', stars:[['太阴','major','禄']], note:'太阴入疾厄化禄:劳心多于劳力,睡眠与情绪为养生之首。' },
  { name:'迁移', branch:'子', stars:[['贪狼','major'],['擎羊','minor']], note:'贪狼入迁移,动中取趣:异地多机遇亦多诱惑,择善而往。' },
  { name:'交友', branch:'丑', stars:[['巨门','major']], note:'巨门入交友,口碑两极:言路畅通而口舌亦多,重诺者可深交。' },
  { name:'官禄', branch:'寅', stars:[['天相','major'],['天梁','major']], note:'天相会天梁于官禄,辅弼之才:宜体制与专业路径,清望与实权相济。' },
  { name:'田宅', branch:'卯', stars:[['天同','major'],['天姚','minor']], note:'天同入田宅,安居之福:居所安逸讲究,家宅和暖。' },
  { name:'福德', branch:'辰', stars:[['破军','major']], note:'破军入福德,心境常新:兴味多变、破立交替,静坐功课可养神。' },
  { name:'父母', branch:'巳', stars:[['文昌','minor'],['文曲','minor']], note:'昌曲入父母,书香一脉:亲长重教,幼承文墨,荫庇在笔墨之间。' },
];

// ———— 渲染器与色彩 ————
const stage = document.getElementById('stage');
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
stage.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x100d0a);
scene.fog = new THREE.FogExp2(0x100d0a, 0.022);

// 环境反射(金属质感的关键)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.06).texture;
if ('environmentIntensity' in scene) scene.environmentIntensity = 0.38;

const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
camera.position.set(0, 8.4, 11.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.dampingFactor = 0.05;
controls.minDistance = 7; controls.maxDistance = 26;
controls.maxPolarAngle = Math.PI * 0.49; controls.target.set(0, 0, 0);

// ———— 灯光:暖主光 + 冷弱补 + 朱砂缘光 ————
scene.add(new THREE.HemisphereLight(0x3a3226, 0x0c0a08, 0.5));
const key = new THREE.DirectionalLight(0xffe2a8, 1.6); key.position.set(7, 12, 5); scene.add(key);
const fill = new THREE.DirectionalLight(0x8a97b8, 0.25); fill.position.set(-8, 6, -4); scene.add(fill);
const rim = new THREE.PointLight(0xd14a35, 0.55, 40, 1.8); rim.position.set(-9, 3.5, -7); scene.add(rim);

// ———— 材质(承 T09 tokens)———
const patina = new THREE.MeshPhysicalMaterial({
  color: 0x5e7157, metalness: 0.92, roughness: 0.44,
  clearcoat: 0.55, clearcoatRoughness: 0.32,
});
const patinaHi = patina.clone();
patinaHi.color = new THREE.Color(0x7d9370);
patinaHi.emissive = new THREE.Color(0x2c3a26); patinaHi.emissiveIntensity = 0.9;
const goldMetal = new THREE.MeshPhysicalMaterial({
  color: 0xd8b45a, metalness: 1, roughness: 0.24,
  emissive: 0x7a5a1c, emissiveIntensity: 1.15, clearcoat: 0.4,
});
const cinnabarMat = new THREE.MeshPhysicalMaterial({
  color: 0xd14a35, metalness: 0.35, roughness: 0.35,
  emissive: 0x8f1d0d, emissiveIntensity: 1.6,
});
const engraveMat = new THREE.MeshStandardMaterial({ color: 0xb9a26b, metalness: 0.95, roughness: 0.35, emissive: 0x40320f, emissiveIntensity: 0.5 });
const darkPlate = new THREE.MeshPhysicalMaterial({ color: 0x2b241a, metalness: 0.75, roughness: 0.6, clearcoat: 0.3 });

// 高分辨率文字贴片
function textPlate(lines, opt = {}) {
  const W = 512, H = 256, dpr = 2;
  const c = document.createElement('canvas'); c.width = W * dpr; c.height = H * dpr;
  const g = c.getContext('2d'); g.scale(dpr, dpr);
  g.textAlign = 'center'; g.textBaseline = 'middle';
  lines.forEach(([text, px, color, dy]) => {
    g.font = `600 ${px}px "Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif`;
    g.shadowColor = 'rgba(0,0,0,0.55)'; g.shadowBlur = 8;
    g.fillStyle = color; g.fillText(text, W / 2, H / 2 + dy);
  });
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = renderer.capabilities.getMaxAnisotropy();
  tex.colorSpace = THREE.SRGBColorSpace;
  const w = opt.w ?? 1.5, h = opt.h ?? 0.75;
  return new THREE.Mesh(new THREE.PlaneGeometry(w, h),
    new THREE.MeshBasicMaterial({ map: tex, transparent: true, opacity: opt.opacity ?? 0.96, depthWrite: false }));
}
// 星曜辉光贴片(additive)
function glowSprite(colorHex, scale = 1) {
  const s = 128, c = document.createElement('canvas'); c.width = c.height = s;
  const g = c.getContext('2d');
  const grad = g.createRadialGradient(s/2, s/2, 0, s/2, s/2, s/2);
  const col = new THREE.Color(colorHex);
  const [r, gg, b] = [col.r*255|0, col.g*255|0, col.b*255|0];
  grad.addColorStop(0,   `rgba(${r},${gg},${b},0.95)`);
  grad.addColorStop(0.25,`rgba(${r},${gg},${b},0.38)`);
  grad.addColorStop(0.6, `rgba(${r},${gg},${b},0.10)`);
  grad.addColorStop(1,   `rgba(${r},${gg},${b},0)`);
  g.fillStyle = grad; g.fillRect(0, 0, s, s);
  const tex = new THREE.CanvasTexture(c); tex.colorSpace = THREE.SRGBColorSpace;
  const sp = new THREE.Sprite(new THREE.SpriteMaterial({
    map: tex, blending: THREE.AdditiveBlending, depthWrite: false, transparent: true, opacity: 0.8 }));
  sp.scale.setScalar(scale);
  return sp;
}

// ———— 盘面 ————
const chart = new THREE.Group(); scene.add(chart);
const R_IN = 4.1, R_OUT = 7.7, SEG = Math.PI * 2 / 12;
const segs = [], twinkles = [];
PALACES.forEach((p, i) => {
  const a0 = -Math.PI / 2 - SEG / 2 + i * SEG, mid = a0 + SEG / 2;
  const seg = new THREE.Mesh(new THREE.RingGeometry(R_IN, R_OUT, 56, 1, a0, SEG), patina.clone());
  seg.rotation.x = -Math.PI / 2;
  seg.material.color.offsetHSL(0, 0, (i % 2 ? 0.012 : -0.008)); // 做旧不均
  seg.userData = { index: i };
  chart.add(seg); segs.push(seg);

  // 宫名 + 地支:刻在环面,径向排布
  const nm = textPlate([[p.name, 118, '#e6c87a', 0]], { w: 1.7, h: 0.85 });
  nm.rotation.x = -Math.PI / 2; nm.rotation.z = -(mid) + Math.PI / 2;
  nm.position.set(Math.cos(mid) * (R_IN + 1.15), 0.015, -Math.sin(mid) * (R_IN + 1.15));
  chart.add(nm);
  const br = textPlate([[p.branch, 78, '#b3a888', 0]], { w: 0.72, h: 0.36 });
  br.rotation.x = -Math.PI / 2; br.rotation.z = -(mid) + Math.PI / 2;
  br.position.set(Math.cos(mid) * (R_IN + 0.38), 0.015, -Math.sin(mid) * (R_IN + 0.38));
  chart.add(br);

  p.stars.forEach((s, j) => {
    const major = s[1] === 'major';
    const r = R_OUT - 0.8 - (j % 2) * 1.05;
    const t = mid + (Math.floor(j / 2) - (p.stars.length - 1) / 4) * 0.17;
    const size = major ? 0.24 : 0.14;
    const star = new THREE.Mesh(new THREE.SphereGeometry(size, 26, 26), goldMetal);
    star.position.set(Math.cos(t) * r, size + 0.07, -Math.sin(t) * r);
    chart.add(star);
    const glow = glowSprite(0xffd98a, major ? 2.1 : 1.2);
    glow.position.copy(star.position).setY(size + 0.22);
    chart.add(glow); twinkles.push({ sp: glow, phase: Math.random() * Math.PI * 2, amp: major ? 0.22 : 0.3 });
    if (s[2]) {
      const mark = new THREE.Mesh(new THREE.OctahedronGeometry(0.11), cinnabarMat);
      mark.position.set(star.position.x, size + 0.5, star.position.z);
      chart.add(mark);
      const mg = glowSprite(0xff5a3c, 0.7); mg.position.copy(mark.position); chart.add(mg);
      const ml = textPlate([['化' + s[2], 84, '#ff8a70', 0]], { w: 0.62, h: 0.31, opacity: 0.95 });
      ml.rotation.x = -Math.PI / 2;
      ml.position.set(mark.position.x, 0.02, mark.position.z - 0.42);
      chart.add(ml);
    }
  });
});

// 宫界刻线 + 外缘刻度(仪器感)
for (let i = 0; i < 12; i++) {
  const a = -Math.PI / 2 - SEG / 2 + i * SEG;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.025, 0.012, R_OUT - R_IN + 0.1), engraveMat);
  tick.position.set(Math.cos(a) * (R_IN + R_OUT) / 2, 0.006, -Math.sin(a) * (R_IN + R_OUT) / 2);
  tick.rotation.y = -a; chart.add(tick);
}
for (let i = 0; i < 72; i++) { // 细刻度
  const a = i * Math.PI * 2 / 72, long = i % 6 === 0;
  const t = new THREE.Mesh(new THREE.BoxGeometry(0.018, 0.01, long ? 0.34 : 0.18), engraveMat);
  t.position.set(Math.cos(a) * (R_OUT + 0.16), 0.006, -Math.sin(a) * (R_OUT + 0.16));
  t.rotation.y = -a; chart.add(t);
}
[[R_OUT + 0.05, 0.028], [R_IN - 0.05, 0.028], [R_IN - 0.5, 0.014], [R_IN - 1.05, 0.014]]
  .forEach(([r, tube]) => {
    const ring = new THREE.Mesh(new THREE.TorusGeometry(r, tube, 10, 160), engraveMat);
    ring.rotation.x = Math.PI / 2; ring.position.y = 0.01; chart.add(ring);
  });

// 中宫盘芯
const corePlate = new THREE.Mesh(new THREE.CircleGeometry(R_IN - 0.55, 96), darkPlate);
corePlate.rotation.x = -Math.PI / 2; corePlate.position.y = -0.005; chart.add(corePlate);
const axes = [[0, 1], [1, 0]].forEach(([dx, dz]) => {
  const line = new THREE.Mesh(new THREE.BoxGeometry(dx ? (R_IN - 0.6) * 2 : 0.012, 0.008, dz ? (R_IN - 0.6) * 2 : 0.012), engraveMat);
  line.position.y = 0.008; chart.add(line);
});
const t1 = textPlate([['璇玑', 150, '#e6c87a', -28]], { w: 2.6, h: 1.3 });
t1.rotation.x = -Math.PI / 2; t1.position.set(0, 0.02, -1.15); chart.add(t1);
const t2 = textPlate([['A R M I L L A', 46, '#b3a888', 0], ['一九九〇 · 六月十五 · 午', 40, '#9c8f74', 46]], { w: 2.9, h: 1.45 });
t2.rotation.x = -Math.PI / 2; t2.position.set(0, 0.02, 1.15); chart.add(t2);
const core = new THREE.Mesh(new THREE.SphereGeometry(0.1, 22, 22), goldMetal);
core.position.y = 0.3; chart.add(core);
const coreGlow = glowSprite(0xffd98a, 0.9); coreGlow.position.set(0, 0.34, 0); chart.add(coreGlow);
twinkles.push({ sp: coreGlow, phase: 0.5, amp: 0.18 });

// 远景星野(两层)
function starField(count, rMin, rMax, size, opacity) {
  const pos = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = rMin + Math.random() * (rMax - rMin);
    const th = Math.random() * Math.PI * 2, ph = Math.acos(2 * Math.random() - 1);
    pos[i*3] = r * Math.sin(ph) * Math.cos(th);
    pos[i*3+1] = r * Math.cos(ph) * 0.55 + 2;
    pos[i*3+2] = r * Math.sin(ph) * Math.sin(th);
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
  return new THREE.Points(geo, new THREE.PointsMaterial({
    color: 0xd8c8a0, size, transparent: true, opacity, depthWrite: false,
    blending: THREE.AdditiveBlending, sizeAttenuation: true }));
}
scene.add(starField(900, 22, 60, 0.09, 0.5));
scene.add(starField(400, 14, 30, 0.05, 0.35));

// ———— 交互 ————
let hovered = -1;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => {
  ptr.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(segs)[0];
  const idx = hit ? hit.object.userData.index : -1;
  if (idx !== hovered) {
    segs.forEach((s, k) => { s.material.emissive = new THREE.Color(0x000000); });
    if (idx >= 0) segs[idx].material = patinaHi;
    else segs.forEach((s, k) => s.material === patinaHi && (s.material = patina.clone()));
    hovered = idx; renderer.domElement.style.cursor = idx >= 0 ? 'pointer' : 'grab';
  }
});
renderer.domElement.addEventListener('click', () => {
  if (hovered < 0) return;
  const p = PALACES[hovered];
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-branch').textContent = `地支 ${p.branch} · PALACE ${hovered + 1} / 12`;
  document.getElementById('p-stars').innerHTML = p.stars.map(s =>
    `<li><span>${s[0]}</span>${s[2] ? `<span class="sihua">化${s[2]}</span>` : `<span class="grade">${s[1] === 'major' ? '主星' : '辅曜'}</span>`}</li>`).join('');
  document.getElementById('p-note').textContent = p.note;
  document.getElementById('p-src').textContent = '解读依据传统星情与开源格局库 · 不作祸福断言';
  document.getElementById('panel').classList.add('open');
});

// ———— 后期:轻泛光(只让星曜与朱砂发光)———
const composer = new EffectComposer(renderer);
composer.addPass(new RenderPass(scene, camera));
const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 0.85, 0.85, 0.72);
composer.addPass(bloom);
composer.addPass(new OutputPass());

// ———— 入场动画 + 主循环 ————
const intro = { t: 0 };
const chartFinalY = 0, chartStartRot = -0.5;
chart.rotation.y = chartStartRot; chart.scale.setScalar(0.92);
let t0 = performance.now(), interacted = false;
controls.addEventListener('start', () => interacted = true);
(function loop(t) {
  const dt = Math.min((t - t0) / 1000, 0.05); t0 = t;
  intro.t = Math.min(intro.t + dt / 1.4, 1);
  const e = 1 - Math.pow(1 - intro.t, 3);
  chart.scale.setScalar(0.92 + 0.08 * e);
  chart.rotation.y = chartStartRot * (1 - e) + (interacted ? chart.rotation.y : chart.rotation.y + dt * 0.045 * e);
  core.position.y = 0.3 + Math.sin(t / 1100) * 0.05;
  twinkles.forEach(k => k.sp.material.opacity = 0.62 + k.amp * Math.sin(t / 700 + k.phase) + 0.12);
  controls.update();
  composer.render();
  requestAnimationFrame(loop);
})(t0);

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); composer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
