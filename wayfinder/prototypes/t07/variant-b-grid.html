<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>T07 原型 B · 传统方阵立体化(青铜地盘)</title>
<style>
  :root { --bg:#16130f; --gold:#d8b45a; --cinnabar:#c03d2e; --ink:#e8ddc8; --muted:#a89a7c; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .hud { position:fixed; top:20px; left:24px; z-index:5; }
  .hud h1 { font-size:15px; letter-spacing:.35em; font-weight:600; color:var(--muted); }
  .hud p  { font-size:12px; color:var(--muted); opacity:.75; margin-top:6px; letter-spacing:.12em; }
  #panel { position:fixed; top:0; right:0; height:100%; width:300px; padding:28px 24px;
           background:linear-gradient(to left, rgba(16,13,10,.92), rgba(16,13,10,.78));
           border-left:1px solid #3a3122; transform:translateX(100%);
           transition:transform .35s cubic-bezier(.16,1,.3,1); z-index:4; }
  #panel.open { transform:none; }
  #panel .tag { font-size:11px; letter-spacing:.4em; color:var(--muted); }
  #panel h2 { font-size:26px; margin:10px 0 2px; color:var(--gold); font-weight:600; }
  #panel .branch { font-size:13px; color:var(--muted); margin-bottom:18px; }
  #panel .stars { list-style:none; margin:0 0 18px; padding:0; }
  #panel .stars li { font-size:15px; padding:7px 0; border-bottom:1px solid #2c2620; display:flex; justify-content:space-between; }
  #panel .stars .sihua { color:var(--cinnabar); font-size:13px; }
  #panel .note { font-size:13px; line-height:2; color:#cbbfa6; }
  #hint { position:fixed; bottom:18px; left:24px; font-size:12px; color:var(--muted); opacity:.7; letter-spacing:.15em; z-index:5; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <h1>璇玑 · 原型 B 传统方阵</h1>
  <p>青铜地盘 · 4×4 立体宫格 · 鎏金星钉</p>
</div>
<div id="hint">拖动环视 · 滚轮缩放 · 点击宫格看解读</div>
<aside id="panel">
  <div class="tag">PALACE</div>
  <h2 id="p-name">—</h2>
  <div class="branch" id="p-branch">—</div>
  <ul class="stars" id="p-stars"></ul>
  <p class="note" id="p-note"></p>
</aside>

<script type="importmap">
{ "imports": { "three": "../../lib/three.module.min.js",
               "three/addons/controls/OrbitControls.js": "../../lib/addons/controls/OrbitControls.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// 盘面样例数据(构图原型用)—— 传统 4×4:外圈 12 格为宫,中心 2×2 为盘芯
// 网格坐标 (row, col),row 0 在南(下)
const LAYOUT = [
  { name:'父母', branch:'巳', cell:[0,0], stars:[['文昌','minor'],['文曲','minor']], note:'昌曲入父母,书香一脉:亲长重教,幼承文墨。' },
  { name:'福德', branch:'辰', cell:[0,1], stars:[['破军','major']], note:'破军入福德,心境常新:兴味多变,静坐可养神。' },
  { name:'田宅', branch:'卯', cell:[0,2], stars:[['天同','major'],['天姚','minor']], note:'天同入田宅,安居之福:居所安逸,家宅和暖。' },
  { name:'官禄', branch:'寅', cell:[0,3], stars:[['天相','major'],['天梁','major']], note:'天相会天梁于官禄,辅弼之才:清望与实权相济。' },
  { name:'交友', branch:'丑', cell:[1,0], stars:[['巨门','major']], note:'巨门入交友,口碑两极:重诺者可深交。' },
  { name:'命宫', branch:'午', cell:[1,3], stars:[['紫微','major','科'],['左辅','minor']], note:'紫微坐命,帝座临身:格局开阔,进退有度。' },
  { name:'迁移', branch:'子', cell:[2,0], stars:[['贪狼','major'],['擎羊','minor']], note:'贪狼入迁移,动中取趣:择善而往。' },
  { name:'疾厄', branch:'亥', cell:[2,3], stars:[['太阴','major','禄']], note:'太阴入疾厄化禄:劳心多于劳力,睡眠为养生之首。' },
  { name:'财帛', branch:'戌', cell:[3,0], stars:[['天府','major']], note:'天府入财帛,库星守财:进财稳厚,取财有道。' },
  { name:'子女', branch:'酉', cell:[3,1], stars:[['武曲','major','忌'],['七杀','major']], note:'武曲化忌会七杀:子女刚毅,管教宜疏不宜堵。' },
  { name:'夫妻', branch:'申', cell:[3,2], stars:[['太阳','major','权']], note:'太阳化权入夫妻:配偶明朗主事,光照他宫。' },
  { name:'兄弟', branch:'未', cell:[3,3], stars:[['天机','major'],['天马','minor']], note:'天机入兄弟:手足各异志,情理常在。' },
];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x16130f);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x16130f, 14, 30);
const camera = new THREE.PerspectiveCamera(40, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0.5, 6.2, 7.4);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.target.set(0, 0, 0);
controls.minDistance = 4; controls.maxDistance = 16; controls.maxPolarAngle = Math.PI * 0.46;

scene.add(new THREE.AmbientLight(0x8a7c5e, 0.5));
const key = new THREE.DirectionalLight(0xffe9b0, 1.15); key.position.set(5, 9, 5); scene.add(key);
const rim = new THREE.PointLight(0xc03d2e, 0.3, 24); rim.position.set(-6, 3, -5); scene.add(rim);

const bronze   = new THREE.MeshStandardMaterial({ color:0x5c6b52, metalness:0.85, roughness:0.5 });
const bronzeHi = new THREE.MeshStandardMaterial({ color:0x7d9070, metalness:0.9, roughness:0.38, emissive:0x2a3324, emissiveIntensity:0.7 });
const goldMat  = new THREE.MeshStandardMaterial({ color:0xd8b45a, metalness:1, roughness:0.28, emissive:0x6b4f16, emissiveIntensity:0.55 });
const cinnabar = new THREE.MeshStandardMaterial({ color:0xc03d2e, metalness:0.4, roughness:0.4, emissive:0x5c130a, emissiveIntensity:0.85 });
const baseMat  = new THREE.MeshStandardMaterial({ color:0x2b241c, metalness:0.2, roughness:0.9 });

function label(text, size=64, color='#e8ddc8') {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.font = `600 ${size}px "Noto Serif SC","Songti SC",SimSun,serif`;
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle = color; g.fillText(text, 128, 64);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.75),
    new THREE.MeshBasicMaterial({ map:t, transparent:true, opacity:0.95, depthWrite:false }));
}

// 地盘基座
const base = new THREE.Mesh(new THREE.BoxGeometry(9.6, 0.5, 9.6), baseMat);
base.position.y = -0.45; scene.add(base);
const rimRing = new THREE.Mesh(new THREE.BoxGeometry(9.9, 0.18, 9.9), bronze.clone());
rimRing.position.y = -0.68; scene.add(rimRing);

const CELL = 2.2, GAP = 0.12;
const cells = [];
const occupied = new Set(LAYOUT.map(p => p.cell.join(',')));
for (let r = 0; r < 4; r++) for (let c = 0; c < 4; c++) {
  const k = [r, c].join(',');
  const isCenter = (r === 1 && c === 1) || (r === 1 && c === 2) || (r === 2 && c === 1) || (r === 2 && c === 2);
  const palace = LAYOUT.find(p => p.cell.join(',') === k);
  const h = palace ? 0.34 : (isCenter ? 0.22 : 0.26);
  const mesh = new THREE.Mesh(new THREE.BoxGeometry(CELL - GAP, h, CELL - GAP), (palace ? bronze : baseMat).clone());
  const x = (c - 1.5) * CELL, z = (1.5 - r) * CELL;
  mesh.position.set(x, h / 2 - 0.2, z);
  mesh.userData = { palace };
  scene.add(mesh); if (palace) cells.push(mesh);

  if (palace) {
    const nm = label(palace.name, 66, '#d8b45a');
    nm.rotation.x = -Math.PI/2;
    nm.position.set(x, h - 0.19 + 0.02, z + 0.62);
    nm.scale.set(0.72, 0.36, 1); scene.add(nm);
    const br = label(palace.branch, 44, '#a89a7c');
    br.rotation.x = -Math.PI/2;
    br.position.set(x - 0.78, h - 0.19 + 0.02, z + 0.66);
    br.scale.set(0.4, 0.2, 1); scene.add(br);

    palace.stars.forEach((s, j) => {
      const size = s[1] === 'major' ? 0.17 : 0.1;
      const star = new THREE.Mesh(new THREE.CylinderGeometry(size, size * 0.7, 0.1, 20), goldMat);
      star.position.set(x + 0.55 - j * 0.55, h - 0.19 + 0.07, z - 0.45 + (j % 2) * 0.42);
      scene.add(star);
      if (s[2]) {
        const mark = new THREE.Mesh(new THREE.OctahedronGeometry(0.09), cinnabar);
        mark.position.set(star.position.x, h - 0.19 + 0.24, star.position.z);
        scene.add(mark);
        const ml = label('化' + s[2], 46, '#e06a55');
        ml.rotation.x = -Math.PI/2;
        ml.position.set(star.position.x, h - 0.19 + 0.03, star.position.z - 0.3);
        ml.scale.set(0.42, 0.21, 1); scene.add(ml);
      }
    });
  }
}
// 盘芯刻文
const core = label('璇玑 · 1990-06-15 · 午 · 男', 42, '#a89a7c');
core.rotation.x = -Math.PI/2;
core.position.set(0, 0.05, 0); core.scale.set(1.5, 0.75, 1); scene.add(core);

let hovered = null;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => {
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(cells)[0];
  const obj = hit ? hit.object : null;
  if (obj !== hovered) {
    if (hovered) hovered.material = bronze.clone();
    if (obj) obj.material = bronzeHi.clone();
    hovered = obj; renderer.domElement.style.cursor = obj ? 'pointer' : 'grab';
  }
});
renderer.domElement.addEventListener('click', () => {
  if (!hovered) return;
  const p = hovered.userData.palace;
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-branch').textContent = `地支 · ${p.branch}`;
  document.getElementById('p-stars').innerHTML = p.stars.map(s =>
    `<li><span>${s[0]}</span>${s[2] ? `<span class="sihua">化${s[2]}</span>` : '<span style="opacity:.4;font-size:12px">星曜</span>'}</li>`).join('');
  document.getElementById('p-note').textContent = p.note;
  document.getElementById('panel').classList.add('open');
});

let t0 = performance.now();
(function loop(t) {
  const dt = (t - t0)/1000; t0 = t;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})(t0);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
