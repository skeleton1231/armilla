<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<title>T07 原型 C · 双环浑仪(雕塑化)</title>
<style>
  :root { --bg:#16130f; --gold:#d8b45a; --cinnabar:#c03d2e; --ink:#e8ddc8; --muted:#a89a7c; }
  * { margin:0; box-sizing:border-box; }
  body { background:var(--bg); color:var(--ink); font-family:"Noto Serif SC","Source Han Serif SC","Songti SC",SimSun,serif; overflow:hidden; }
  #stage { position:fixed; inset:0; }
  .hud { position:fixed; top:20px; left:24px; z-index:5; }
  .hud h1 { font-size:15px; letter-spacing:.35em; font-weight:600; color:var(--muted); }
  .hud p  { font-size:12px; color:var(--muted); opacity:.75; margin-top:6px; letter-spacing:.12em; }
  #panel { position:fixed; top:0; right:0; height:100%; width:300px; padding:28px 24px;
           background:linear-gradient(to left, rgba(16,13,10,.92), rgba(16,13,10,.78));
           border-left:1px solid #3a3122; transform:translateX(100%);
           transition:transform .35s cubic-bezier(.16,1,.3,1); z-index:4; }
  #panel.open { transform:none; }
  #panel .tag { font-size:11px; letter-spacing:.4em; color:var(--muted); }
  #panel h2 { font-size:26px; margin:10px 0 2px; color:var(--gold); font-weight:600; }
  #panel .branch { font-size:13px; color:var(--muted); margin-bottom:18px; }
  #panel .stars { list-style:none; margin:0 0 18px; padding:0; }
  #panel .stars li { font-size:15px; padding:7px 0; border-bottom:1px solid #2c2620; display:flex; justify-content:space-between; }
  #panel .stars .sihua { color:var(--cinnabar); font-size:13px; }
  #panel .note { font-size:13px; line-height:2; color:#cbbfa6; }
  #hint { position:fixed; bottom:18px; left:24px; font-size:12px; color:var(--muted); opacity:.7; letter-spacing:.15em; z-index:5; }
</style>
</head>
<body>
<div id="stage"></div>
<div class="hud">
  <h1>璇玑 · 原型 C 双环浑仪</h1>
  <p>外环十二宫 · 内环地支刻度 · 环环自转</p>
</div>
<div id="hint">拖动环视 · 滚轮缩放 · 点击外环宫位看解读</div>
<aside id="panel">
  <div class="tag">PALACE</div>
  <h2 id="p-name">—</h2>
  <div class="branch" id="p-branch">—</div>
  <ul class="stars" id="p-stars"></ul>
  <p class="note" id="p-note"></p>
</aside>

<script type="importmap">
{ "imports": { "three": "../../lib/three.module.min.js",
               "three/addons/controls/OrbitControls.js": "../../lib/addons/controls/OrbitControls.js" } }
</script>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const PALACES = [
  { name:'命宫', branch:'午', stars:[['紫微','major','科'],['左辅','minor']], note:'紫微坐命,帝座临身:格局开阔,进退有度。' },
  { name:'兄弟', branch:'未', stars:[['天机','major'],['天马','minor']], note:'天机入兄弟:手足各异志,情理常在。' },
  { name:'夫妻', branch:'申', stars:[['太阳','major','权']], note:'太阳化权入夫妻:配偶明朗主事。' },
  { name:'子女', branch:'酉', stars:[['武曲','major','忌'],['七杀','major']], note:'武曲化忌会七杀:管教宜疏不宜堵。' },
  { name:'财帛', branch:'戌', stars:[['天府','major']], note:'天府入财帛:进财稳厚,取财有道。' },
  { name:'疾厄', branch:'亥', stars:[['太阴','major','禄']], note:'太阴化禄入疾厄:劳心多于劳力。' },
  { name:'迁移', branch:'子', stars:[['贪狼','major'],['擎羊','minor']], note:'贪狼入迁移:异地多机遇,择善而往。' },
  { name:'交友', branch:'丑', stars:[['巨门','major']], note:'巨门入交友:重诺者可深交。' },
  { name:'官禄', branch:'寅', stars:[['天相','major'],['天梁','major']], note:'天相会天梁:清望与实权相济。' },
  { name:'田宅', branch:'卯', stars:[['天同','major'],['天姚','minor']], note:'天同入田宅:居所安逸,家宅和暖。' },
  { name:'福德', branch:'辰', stars:[['破军','major']], note:'破军入福德:心境常新,静坐养神。' },
  { name:'父母', branch:'巳', stars:[['文昌','minor'],['文曲','minor']], note:'昌曲入父母:幼承文墨,荫庇在笔墨。' },
];

const renderer = new THREE.WebGLRenderer({ antialias:true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x16130f);
document.getElementById('stage').appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x16130f, 16, 38);
const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(3, 4.5, 10);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.minDistance = 5; controls.maxDistance = 20;

scene.add(new THREE.AmbientLight(0x8a7c5e, 0.5));
const key = new THREE.DirectionalLight(0xffe9b0, 1.1); key.position.set(6, 8, 4); scene.add(key);
const rim = new THREE.PointLight(0xc03d2e, 0.35, 26); rim.position.set(-7, 3, -6); scene.add(rim);

const bronze   = new THREE.MeshStandardMaterial({ color:0x5c6b52, metalness:0.88, roughness:0.5 });
const bronzeHi = new THREE.MeshStandardMaterial({ color:0x7d9070, metalness:0.92, roughness:0.38, emissive:0x2a3324, emissiveIntensity:0.7 });
const goldMat  = new THREE.MeshStandardMaterial({ color:0xd8b45a, metalness:1, roughness:0.28, emissive:0x6b4f16, emissiveIntensity:0.55 });
const cinnabar = new THREE.MeshStandardMaterial({ color:0xc03d2e, metalness:0.4, roughness:0.4, emissive:0x5c130a, emissiveIntensity:0.85 });
const lineMat  = new THREE.MeshStandardMaterial({ color:0xa89a7c, metalness:0.8, roughness:0.45 });

function label(text, size=64, color='#e8ddc8') {
  const c = document.createElement('canvas'); c.width = 256; c.height = 128;
  const g = c.getContext('2d');
  g.font = `600 ${size}px "Noto Serif SC","Songti SC",SimSun,serif`;
  g.textAlign='center'; g.textBaseline='middle'; g.fillStyle = color; g.fillText(text, 128, 64);
  const t = new THREE.CanvasTexture(c); t.anisotropy = 4;
  return new THREE.Mesh(new THREE.PlaneGeometry(1.5, 0.75),
    new THREE.MeshBasicMaterial({ map:t, transparent:true, opacity:0.95, depthWrite:false, side:THREE.DoubleSide }));
}

// —— 外环:十二宫板块环(立起的浑仪环)——
const outer = new THREE.Group(); scene.add(outer);
const R = 5.4, ARC = Math.PI*2/12;
const blocks = [];
PALACES.forEach((p, i) => {
  const a = -Math.PI/2 + i*ARC;                    // 命宫(午)在正下方
  const block = new THREE.Mesh(new THREE.BoxGeometry(2.4, 1.0, 0.42), bronze.clone());
  block.position.set(Math.cos(a)*R, 0, Math.sin(a)*R);
  block.lookAt(0, 0, 0);
  block.userData = { index: i };
  outer.add(block); blocks.push(block);

  const nm = label(p.name, 68, '#d8b45a');
  nm.position.copy(block.position).multiplyScalar(0.965); nm.position.y = 0.18;
  nm.lookAt(camera.position.clone().multiplyScalar(0.2)); nm.scale.set(0.9, 0.45, 1);
  nm.userData = { follow: i }; outer.add(nm);

  const br = label(p.branch, 46, '#a89a7c');
  br.position.copy(block.position).multiplyScalar(0.9); br.position.y = -0.26;
  br.userData = { follow: i }; outer.add(br);

  p.stars.forEach((s, j) => {
    const size = s[1]==='major' ? 0.14 : 0.09;
    const star = new THREE.Mesh(new THREE.SphereGeometry(size, 18, 18), goldMat);
    star.position.set(block.position.x + (j - (p.stars.length-1)/2) * 0.34 * Math.sin(a),
                      0.62,
                      block.position.z - (j - (p.stars.length-1)/2) * 0.34 * Math.cos(a));
    star.userData = { follow: i };
    outer.add(star);
    if (s[2]) {
      const mark = new THREE.Mesh(new THREE.OctahedronGeometry(0.08), cinnabar);
      mark.position.set(star.position.x, 0.86, star.position.z);
      mark.userData = { follow: i };
      outer.add(mark);
    }
  });
});

// —— 内环:地支刻度环(反向自转)——
const inner = new THREE.Group(); scene.add(inner);
const BRANCH = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const ringT = new THREE.Mesh(new THREE.TorusGeometry(3.5, 0.05, 12, 120), lineMat);
ringT.rotation.x = Math.PI/2; inner.add(ringT);
BRANCH.forEach((b, i) => {
  const a = i * ARC;
  const tick = new THREE.Mesh(new THREE.BoxGeometry(0.03, 0.22, 0.03), lineMat);
  tick.position.set(Math.cos(a)*3.5, 0, Math.sin(a)*3.5); inner.add(tick);
  const lb = label(b, 52, '#a89a7c');
  lb.position.set(Math.cos(a)*3.1, 0, Math.sin(a)*3.1);
  lb.lookAt(camera.position); lb.scale.set(0.5, 0.25, 1);
  lb.userData = { billboard: true }; inner.add(lb);
});

// —— 浑仪骨架:交叉双环 + 极轴 ——
const sk1 = new THREE.Mesh(new THREE.TorusGeometry(4.4, 0.035, 10, 120), lineMat);
sk1.rotation.x = Math.PI/2; scene.add(sk1);
const sk2 = new THREE.Mesh(new THREE.TorusGeometry(4.4, 0.035, 10, 120), lineMat);
sk2.rotation.set(Math.PI/2, 0, 0); sk2.rotation.y = Math.PI/4; sk2.rotation.x = Math.PI/3; scene.add(sk2);
const axis = new THREE.Mesh(new THREE.CylinderGeometry(0.02, 0.02, 7.2, 8), lineMat);
axis.position.y = 0; scene.add(axis);
const pole = new THREE.Mesh(new THREE.SphereGeometry(0.14, 20, 20), goldMat);
pole.position.y = 3.6; scene.add(pole);
const pole2 = pole.clone(); pole2.position.y = -3.6; scene.add(pole2);

let hovered = -1;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
renderer.domElement.addEventListener('pointermove', e => {
  ptr.set(e.clientX/innerWidth*2-1, -(e.clientY/innerHeight)*2+1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(blocks)[0];
  const idx = hit ? hit.object.userData.index : -1;
  if (idx !== hovered) {
    blocks.forEach(b => b.material = bronze.clone());
    if (idx >= 0) blocks[idx].material = bronzeHi.clone();
    hovered = idx; renderer.domElement.style.cursor = idx>=0 ? 'pointer' : 'grab';
  }
});
renderer.domElement.addEventListener('click', () => {
  if (hovered < 0) return;
  const p = PALACES[hovered];
  document.getElementById('p-name').textContent = p.name;
  document.getElementById('p-branch').textContent = `地支 · ${p.branch}`;
  document.getElementById('p-stars').innerHTML = p.stars.map(s =>
    `<li><span>${s[0]}</span>${s[2] ? `<span class="sihua">化${s[2]}</span>` : '<span style="opacity:.4;font-size:12px">星曜</span>'}</li>`).join('');
  document.getElementById('p-note').textContent = p.note;
  document.getElementById('panel').classList.add('open');
});

let t0 = performance.now();
(function loop(t) {
  const dt = (t - t0)/1000; t0 = t;
  outer.rotation.y += dt * 0.04;     // 外环缓转
  inner.rotation.y -= dt * 0.1;      // 内环反向
  pole.position.y = 3.6; pole2.position.y = -3.6;
  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(loop);
})(t0);
addEventListener('resize', () => {
  camera.aspect = innerWidth/innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
